  <text x="437" y="180" text-anchor="middle" fill="#eafff3" font-family="Segoe UI, sans-serif" font-size="13">Associer · Installer</text>
  <rect x="687" y="62" width="94" height="210" rx="26" fill="#84b89a"/>
  <circle cx="734" cy="166" r="86" fill="#e1fbea"/>
  <circle cx="734" cy="166" r="75" fill="#11291e"/>
