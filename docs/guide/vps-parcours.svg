<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Installer Codex Watch sur un VPS</title><desc id="d">Une console installe le relais sur le serveur, un navigateur permet de le configurer et la montre se connecte directement au serveur.</desc><rect width="1100" height="300" rx="28" fill="#07120d"/><g fill="#10241a" stroke="#315342" stroke-width="2"><rect x="35" y="55" width="280" height="190" rx="24"/><rect x="410" y="55" width="280" height="190" rx="24"/><rect x="785" y="55" width="280" height="190" rx="24"/></g><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#a1f3c7" font-size="40"><text x="175" y="122">⌘</text><text x="550" y="122">◉</text><text x="925" y="122">◷</text></g><g fill="#e4f2e9" font-weight="700" font-size="23"><text x="175" y="161">1. Installer</text><text x="550" y="161">2. Configurer</text><text x="925" y="161">3. Associer</text></g><g fill="#b1c6ba" font-size="17"><text x="175" y="195">Console du VPS</text><text x="550" y="195">Navigateur sécurisé</text><text x="925" y="195">Montre Wear OS</text></g><g fill="#a1f3c7" font-size="32"><text x="362" y="159">→</text><text x="737" y="159">→</text></g></g></svg>
