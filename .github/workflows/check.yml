name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install markdown-it-py==4.0.0
      - run: python scripts/render-guide-html.py --check
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
        working-directory: bridge
      - run: npm test
        working-directory: bridge
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :wear:assembleDebug :wear:assembleRelease :wear:testDebugUnitTest :wear:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: watch-debug
          path: wear/build/outputs/apk/debug/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: bridge
      - run: npm ci
        working-directory: desktop
      - run: node --test test/*.test.cjs
        working-directory: desktop
      - run: node node_modules/electron/install.js
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: .tools/releases/windows/*Setup.exe
  macos-preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: bridge
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:mac
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: macos-preview-unsigned
          path: .tools/releases/windows/*.zip
